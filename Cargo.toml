[package]
name = "omena-query"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Omena query boundary over producer fragments, resolver, and bridge surfaces"
repository = "https://github.com/omenien/omena-query"
readme = "README.md"

[lib]
name = "omena_query"

[lints.rust]
unsafe_code = "deny"
missing_docs = "allow"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[dependencies]
engine-input-producers = { package = "omena-engine-input-producers", git = "https://github.com/omenien/omena-engine-input-producers.git", rev = "9e4d29c" }
omena-abstract-value = { git = "https://github.com/omenien/omena-abstract-value.git", rev = "ef1464d" }
omena-bridge = { git = "https://github.com/omenien/omena-bridge.git", rev = "5997bd5" }
omena-resolver = { git = "https://github.com/omenien/omena-resolver.git", rev = "4018a24" }
serde = { version = "1.0", features = ["derive"] }
