[package]
name = "omena-query"
version = "0.1.9"
edition = "2024"
license = "MIT"
description = "Omena query boundary over producer fragments, resolver, and bridge surfaces"
repository = "https://github.com/omenien/omena-query"
readme = "README.md"
keywords = ["omena", "css-modules", "query", "analysis"]
categories = ["development-tools"]
exclude = [".github/**"]

[lib]
name = "omena_query"

[lints.rust]
unsafe_code = "deny"
missing_docs = "allow"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[dependencies]
engine-input-producers = { package = "omena-engine-input-producers", version = "0.1.3" }
omena-abstract-value = "0.1.2"
omena-bridge = "0.1.7"
omena-resolver = "0.1.0"
serde = { version = "1.0", features = ["derive"] }
