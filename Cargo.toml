[package]
name = "omena-query"
version = "0.1.12"
edition = "2024"
license = "MIT"
description = "Omena query boundary over producer fragments, resolver, and bridge surfaces"
repository = "https://github.com/omenien/omena-query"
readme = "README.md"
keywords = ["omena", "css-modules", "query", "analysis"]
categories = ["development-tools"]
exclude = [".github/**"]

[lib]
name = "omena_query"

[lints.rust]
unsafe_code = "deny"
missing_docs = "allow"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[dependencies]
engine-input-producers = { package = "omena-engine-input-producers", git = "https://github.com/omenien/omena-engine-input-producers.git", rev = "d954723" }
engine-style-parser = { package = "omena-engine-style-parser", git = "https://github.com/omenien/omena-engine-style-parser.git", rev = "5e809bf" }
omena-abstract-value = { git = "https://github.com/omenien/omena-abstract-value.git", rev = "ab6cb50" }
omena-bridge = { git = "https://github.com/omenien/omena-bridge.git", rev = "4b8e3d1" }
omena-incremental = { git = "https://github.com/omenien/omena-incremental.git", rev = "89e5631" }
omena-resolver = { git = "https://github.com/omenien/omena-resolver.git", rev = "98fd27c" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
